[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-mail-service"
version = "0.1.0"
description = "Private, read-only IMAP HTTP service for authorized agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.8",
  "pydantic==2.10.6",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
]

[project.scripts]
hermes-check-mailbox = "hermes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

